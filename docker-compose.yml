services:
  frontend:
    image: ${DOCKER_IMAGE:-dream-house-front-ts:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL in .env}
        VITE_REPORTS_URL: ${VITE_REPORTS_URL:?Set VITE_REPORTS_URL in .env}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
        VITE_SOCKET_PATH: ${VITE_SOCKET_PATH:-/socket.io}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
